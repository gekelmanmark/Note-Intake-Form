<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Support Form | Onity</title>
    <!-- Inline script to check for dark mode immediately -->
    <script>
      // Apply dark mode instantly if it's the saved preference
      document.addEventListener("DOMContentLoaded", () => {
        // Check for saved mode and apply it
        if (localStorage.getItem("mode") === "dark") {
          document.documentElement.classList.add("dark-mode");
        }
        if (localStorage.getItem("expandmode") === "expanded") {
          document.documentElement.classList.add("expand-mode");
        }
      });
      const savedColor = localStorage.getItem("highlightColor");
      if (savedColor) {
        document.documentElement.style.setProperty(
          "--highlight-color",
          savedColor,
        );
      }

      function openInncomNotes() {
          localStorage.setItem("Page Mode", "inncom")
          location.href='inncomtech.html';
      }

      // Called by script.js when document loaded
      function loadSavedValues() {
        var lastPageType = localStorage.getItem("Page Mode");

        if (lastPageType == "inncom") {
          openInncomNotes()
        } else {
          localStorage.setItem("Page Mode", "onity")
        }

        return true;
      }

      // Called by script.js prior to copying form data
      function validateForm() {
        return true
      }

      // Called by script.js when copy button pressed
      function copyPage() {
        const customerName = document.getElementById("customerName")?.value || "";
        const reasonForCall = document.getElementById("reasonForCall")?.value || "";
        const fdsStatus = document.getElementById("fdsStatus")?.value || "";
        const troubleshooting = document.getElementById("troubleshooting")?.value || "";
        const resolution = document.getElementById("resolution")?.value || "";

        let fullText = `S/W:\n${customerName.trim()}\n\n`;
        fullText += `Reason for Call:\n${reasonForCall.trim()}\n\n`;
        fullText += `Troubleshooting Performed:\n${troubleshooting.trim()}\n\n`;
        fullText += `Resolution or Next Steps:\n${resolution.trim()}\n\n`;
        fullText += `FDS Status at End-of-Call:\n${fdsStatus}`;

        return fullText;
      }

      // Called by script.js when clear button pressed
      function clearPage(lastFormState) {
        console.log("Nothing to do")
        return lastFormState;
      }

      // Called by script.js when undo button pressed
      function undoClear(lastFormState) {
        console.log("Nothing to do")
        return true;
      }
    </script>

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="color-selector-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Select Highlight Color</h2>
        <input type="color" id="highlight-color-picker" />
        <div class="color-preview">
          <p>Preview Highlight:</p>
          <div id="color-preview-box"></div>
        </div>
        <button id="apply-color">Apply</button>
        <button id="reset-color">Reset</button>
        </br>
        <button id="toggle-mode"><i class="material-icons">dark_mode</i></button>
        <button id="toggle-border"><i class="material-icons">fullscreen</i></button>
      </div>
    </div>

    <div class="container">
      <header>
        <h1>Customer Support Form</h1>
        <button id="toggle-settings"><i class="material-icons">settings</i></button>
      </header>

      <nav class="navbar">
        <ul>
          <li><a href="index.html" class="nav-link active">Notes</a></li>
          <li><a href="RMA.html" class="nav-link">RMA</a></li>
          <li><a href="Dial-in.html" class="nav-link">Dial-In</a></li>
          <li><a href="Triage.html" class="nav-link">Triage</a></li>
          <li><a href="Product99.html" class="nav-link">Product 99</a></li>
        </ul>
      </nav>
      <div class="team-link">
        <button class="active">Onity</button>
        <button onclick="openInncomNotes()">Inncom</button>
      </div>

      <form id="templateForm">
        <label for="customerName">S/W:</label>
        <textarea
          id="customerName"
          rows="2"
          placeholder="Enter the customer's name"
          required
        ></textarea>

        <label for="reasonForCall">Reason for Call:</label>
        <textarea
          id="reasonForCall"
          rows="2"
          placeholder="Briefly describe the reason for the call"
          required
        ></textarea>

        <label for="troubleshooting">Troubleshooting Performed:</label>
        <textarea
          id="troubleshooting"
          rows="8"
          placeholder="Detail the troubleshooting steps performed"
          required
        ></textarea>

        <label for="resolution">Resolution or Next Steps:</label>
        <textarea
          id="resolution"
          rows="2"
          placeholder="Enter the resolution or next steps"
          required
        ></textarea>

        <label for="fdsStatus">FDS Status at End-of-Call:</label>
        <select id="fdsStatus" name="fdsStatus" required>
          <option value="Not Selected">Not Selected</option>
          <option value="Not Applicable">Not Applicable</option>
          <option value="Fully Operational">Fully Operational</option>
          <option value="Partially Functional With PMS">
            Partially functional with PMS
          </option>
          <option value="Able to make keys manually">
            Able to make keys manually
          </option>
          <option value="No encoders operational">
            No encoders operational
          </option>
        </select>

        <div class="form-buttons">
          <button type="button" id="copyButton">Copy</button>
          <button type="button" id="clearButton">Clear</button>
          <button type="button" id="undoClearButton" class="hidden">
            Undo
          </button>
        </div>
      </form>
      <div id="copyNotification" class="notification hidden">
        Copied to clipboard!
      </div>
    </div>
  </body>
</html>
