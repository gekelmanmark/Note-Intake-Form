<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMA Form | Inncom</title>

    <!-- Inline script to check for dark mode immediately -->
    <script>
      // Apply dark mode instantly if it's the saved preference
      document.addEventListener("DOMContentLoaded", () => {
        // Check for saved mode and apply it
        if (localStorage.getItem("mode") === "dark") {
          document.documentElement.classList.add("dark-mode");
        }
        if (localStorage.getItem("expandmode") === "expanded") {
          document.documentElement.classList.add("expand-mode");
        }
      });
      const savedColor = localStorage.getItem("highlightColor");
      if (savedColor) {
        document.documentElement.style.setProperty(
          "--highlight-color",
          savedColor,
        );
      }
    </script>

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <!-- contains function definitions for loadSavedValues(), copyPage(), clearPage(), and undoClear() -->
    <script src="scripts/inncomrma.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="color-selector-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Select Highlight Color</h2>
        <input type="color" id="highlight-color-picker" />
        <div class="color-preview">
          <p>Preview Highlight:</p>
          <div id="color-preview-box"></div>
        </div>
        <button id="apply-color">Apply</button>
        <button id="reset-color">Reset</button>
        </br>
        <button id="toggle-mode"><i class="material-icons">dark_mode</i></button>
        <button id="toggle-border"><i class="material-icons">fullscreen</i></button>
      </div>
    </div>

    <div class="container">
      <header>
        <h1>Inncom RMA/Quote Request Form</h1>
        <button id="toggle-settings"><i class="material-icons">settings</i></button>
      </header>

      <nav class="navbar">
        <ul>
          <li><a href="index.html" class="nav-link">Notes</a></li>
          <li><a href="RMA.html" class="nav-link active">RMA</a></li>
          <li><a href="Dial-in.html" class="nav-link">Dial-In</a></li>
          <li><a href="Triage.html" class="nav-link">Triage</a></li>
          <li><a href="Product99.html" class="nav-link">Product 99</a></li>
        </ul>
      </nav>
      <div class="team-link">
        <button onclick="location.href='RMA.html';">Onity</button>
        <button class="active">Inncom</button>
      </div>

      <form id="templateForm" name="rmaForm">
        <label for="rmaType">RMA Type:</label>
        <select id="rmaType" name="RMATYPE" required>
          <option value="Not Selected">Not Selected</option>
          <option value="Quote Request">Quote Request</option>
          <option value="RMA Request">RMA Request</option>
        </select>

        <label for="dynamicForm">Parts:</label>
        <div id="dynamicForm"></div>
        <button id="addButton">Add Part</button>

        <label for="rmaNotes">Additional notes:</label>
        <textarea
          name="RMANotes"
          id="rmaNotes"
          rows="3"
          placeholder="Optional notes for CS"
        ></textarea>

        <div class="form-buttons">
          <button name="COPY" type="button" id="copyButton">Copy</button>
          <button name="CLEAR" type="button" id="clearButton">Clear</button>
          <button type="button" id="undoClearButton" class="hidden">
            Undo
          </button>
        </div>
      </form>
      <div id="copyNotification" class="notification hidden">
        Copied to clipboard!
      </div>
    </div>
  </body>
</html>
